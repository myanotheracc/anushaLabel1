<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>AnushaLabel | Product Details</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="index.html" style="color: var(--brand-brown); text-decoration: none; font-weight: bold;">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
        <a href="index.html" class="logo">
            <img src="assets/banner.png" alt="AnushaLabel Logo">
        </a>
        <div class="header-right">
            <a href="https://www.instagram.com/anushalabel" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </header>

    <main class="product-detail-container">
        <div class="slider-container">
            <button class="slider-btn prev" id="prev-btn"><i class="fas fa-chevron-left"></i></button>
            <div class="slider-track" id="slider-track"></div>
            <button class="slider-btn next" id="next-btn"><i class="fas fa-chevron-right"></i></button>
            
            <div class="slider-dots" id="slider-dots"></div> 
        </div>

        <div class="product-info-side">
            <h1 id="p-name">Loading...</h1>
            <p class="product-meta">Category: <span id="p-type">...</span></p>
            <p class="product-meta">Color: <span id="p-color">...</span></p>
            <p class="product-meta">Status: <span id="p-status" style="font-weight: 600;">...</span></p>
            <p class="product-desc" id="p-desc">...</p>
            <a href="#" id="whatsapp-link" target="_blank" class="whatsapp-action-btn">
                <i class="fab fa-whatsapp"></i> Order Now on WhatsApp
            </a>
        </div>
    </main>
    <script src="product.js"></script>
</body>
</html>
