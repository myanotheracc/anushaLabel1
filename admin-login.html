<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | AnushaLabel</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #f4f4f9; margin: 0;">
    <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px;">
        <img src="assets/logo.png" style="width: 80px; margin-bottom: 20px;">
        <h2 style="font-family: 'Playfair Display'; color: var(--brand-brown); margin-bottom: 20px;">Admin Access</h2>
        <input type="email" id="email" class="admin-input" placeholder="Admin Email" style="margin-bottom: 15px;">
        <input type="password" id="password" class="admin-input" placeholder="Password" style="margin-bottom: 20px;">
        <button id="login-btn" class="submit-btn" style="background: var(--brand-brown);">Login</button>
        <p id="error-msg" style="color: red; margin-top: 15px; display: none; font-size: 0.9rem;"></p>
        <div style="margin-top: 20px;"><a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">&larr; Back to Website</a></div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
